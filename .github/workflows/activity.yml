name: Check preserved portfolio (manual only)
# The approved attachment is editorial content. Do not rewrite it on a schedule.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - run: node --check docs/attachment.js

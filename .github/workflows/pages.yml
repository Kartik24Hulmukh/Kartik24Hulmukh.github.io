name: Validate restored attachment and request Pages build
on:
  push:
    branches: [main]
    paths: ['index.html', 'docs/**', 'scripts/validate.py', 'scripts/validate_motion.py', 'scripts/build_bootstrap.py', 'restoration-verification.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - run: node --check docs/attachment.js
      - run: python3 scripts/validate_motion.py
      - run: node --check docs/motion-controller.js
      - run: node --check docs/motion-engine.js
      - run: node --check docs/experience.js
      - run: node --check docs/hero3d.js
      - run: node --check docs/atmosphere.js
      - run: node --check docs/interaction-polish.js
      - name: Request existing branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
